[package]
name = "pensoul-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
pensoul-core = { path = "../pensoul-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
