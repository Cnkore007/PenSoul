[package]
name = "pensoul-domain"
version = "0.1.0"
edition = "2021"
description = "PenSoul 领域模型：实体、关系、约束、本体"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
