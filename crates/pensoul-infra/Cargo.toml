[package]
name = "pensoul-infra"
version = "0.1.0"
edition = "2021"
description = "PenSoul 基础设施：LLM适配、持久化、事件总线"

[dependencies]
pensoul-domain = { path = "../pensoul-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
